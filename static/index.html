<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover 가 있어야 DW 뼈대의 env(safe-area-inset-*) 가 실제 값을 받는다 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>낙장도메인 품질 체커</title>
<link rel="stylesheet" href="/style.css">
<style>
/* 화면 뼈대·부품 모양은 /style.css (static/dw/ 원본 복사본 + static/app.css).
   여기 남는 것은 그 어느 쪽에도 속하지 않는 한 줄뿐이다. */
[hidden]{display:none !important;}
</style>
</head>
<body>
<!-- DW 블록 app-shell-mobile: 붙어 있는 제목 줄 · 가운데만 구르는 본문 · 엄지가 닿는 탭 줄 -->
<div class="dw-block-shell" id="shell">

  <!-- 건너뛰기 링크는 뼈대 안에 둔다 — 판이 열려 뼈대가 inert 가 되면 같이 잠겨야
       Tab 이 판 밖으로 새지 않는다(밖에 두면 aria-modal 이 거짓말이 된다). -->
  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <!-- doweek 의 필터 머리줄 — 흰 띠 안에서 색칠된 알약이 고른 칸으로 미끄러진다.
       구르는 본문 바깥에 붙어 있어 목록을 내려도 안 사라진다. -->
  <header class="filter-header" id="filterHeader" hidden>
    <!-- 여럿 중 하나만 고르는 띠다 — radiogroup 이라고 알려야 화면 낭독기가
         "화살표로 고르세요"를 안내한다(role=group 은 그 말을 못 한다). -->
    <div class="task-sub-tabs" id="verdictFilter" role="radiogroup" aria-label="판정으로 거르기"
         style="--active-idx:0;--tab-count:4">
      <button type="button" class="sub-tab" role="radio" data-verdict="" data-color="var(--dw-cat-1)"
              aria-checked="true" tabindex="0">전체<span class="tab-badge" hidden></span></button>
      <button type="button" class="sub-tab" role="radio" data-verdict="BUY" data-color="var(--dw-success-ink)"
              aria-checked="false" tabindex="-1">매입 후보<span class="tab-badge" hidden></span></button>
      <button type="button" class="sub-tab" role="radio" data-verdict="REVIEW" data-color="var(--dw-warning-ink)"
              aria-checked="false" tabindex="-1">검토 필요<span class="tab-badge" hidden></span></button>
      <button type="button" class="sub-tab" role="radio" data-verdict="REJECT" data-color="var(--dw-error-ink)"
              aria-checked="false" tabindex="-1">제외<span class="tab-badge" hidden></span></button>
    </div>
  </header>

  <main id="main" class="dw-block-shell-body app-screen">

  <!-- ① 살 것 화면 — 주인이 없는 도메인만 온다. 주인 있는 것은 옆 화면으로 빠져서
       여기에는 아예 들어오지 않는다(이 도구의 목적은 낙장 도메인 사기 하나뿐이다). -->
  <section id="list" class="screen on" aria-label="살 것">

    <!-- 찾기 + 내보내기 줄 — 결과가 있으면 늘 맨 위에 있다. 수백 줄을 손가락으로
         다 밀지 않고 글자로 좁히고, 엑셀 뽑기도 여기서 바로 한다(아이콘 하나). -->
    <div class="app-search" id="searchRow" hidden>
      <label class="dw-label dw-sr-only" for="q">도메인 이름으로 찾기</label>
      <input type="search" class="dw-input" id="q" placeholder="도메인 이름으로 찾기"
             autocomplete="off" enterkeyhint="search">
      <button type="button" class="dw-button" data-variant="secondary" data-icon id="csvTop"
              aria-label="엑셀로 내보내기 (CSV)" title="엑셀로 내보내기 (CSV)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
      </button>
    </div>

    <div class="dw-empty-state" id="emptyRows">
      <div class="dw-empty-state-header">
        <span class="dw-empty-state-media" data-variant="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
            <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
          </svg>
        </span>
        <!-- 빈 화면 제목은 DW 가 손글씨를 쓰라고 지정한 세 자리 중 하나다 -->
        <p class="dw-empty-state-title">아직 검사한 것이 없어요</p>
        <!-- 처음 온 사람에게는 이 화면이 전부다 — 무엇을 하는 도구이고 어디를
             누르면 시작되는지, 글 한 줄과 단추 하나로 바로 알려 준다.
             (아래 + 단추만으로는 처음 온 사람이 시작할 곳을 못 찾는다) -->
        <p class="dw-empty-state-description">도메인 목록을 붙여넣으면 하나씩 살펴보고,
          사도 되는 것만 골라 드립니다.</p>
      </div>
      <div class="dw-empty-state-content">
        <button type="button" class="dw-button" data-variant="primary" data-size="lg"
                id="emptyStart">도메인 넣고 검사 시작</button>
      </div>
    </div>

    <div class="dw-list-item-group" id="rows"></div>

    <!-- 거르거나 찾은 결과가 0개일 때 — 백지 대신 이유 한 줄 -->
    <p class="app-filter-empty" id="filterEmpty" role="status" hidden></p>
  </section>

  <!-- ② 남의 것 화면 — 주인이 있어 살 수 없는 도메인이 모이는 곳.
       살 수 없으니 점수도 판정도 안 보여 준다. 이름과 언제 풀리는지, 그리고
       통째로 치우는 단추 하나뿐이다. -->
  <section id="taken" class="screen" aria-label="남의 것">
    <div class="dw-empty-state" id="emptyTaken">
      <div class="dw-empty-state-header">
        <span class="dw-empty-state-media" data-variant="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <p class="dw-empty-state-title">주인 있는 도메인이 없어요</p>
      </div>
    </div>

    <div class="dw-list-item-group" id="takenRows"></div>

    <div class="app-actions" id="takenActions" hidden>
      <button type="button" class="dw-button" data-variant="secondary" data-block
              id="purgeTaken">이 목록 전부 지우기</button>
    </div>
  </section>

  <!-- ③ 설정 화면 -->
  <section id="settings" class="screen" aria-label="설정">
    <div class="dw-block-settings">

      <section class="dw-block-settings-group">
        <h2 class="dw-block-settings-group-title">넣으면 더 정확해지는 것</h2>
        <div class="dw-block-settings-rows">
          <div class="dw-field-group">
            <div class="dw-field">
              <label class="dw-label" for="k_openrouter">OpenRouter</label>
              <div class="dw-field-content">
                <input type="password" class="dw-input" id="k_openrouter" autocomplete="off"
                       aria-describedby="k_openrouter-desc">
                <p class="dw-field-description" id="k_openrouter-desc"><a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a></p>
              </div>
            </div>

          </div>

          <!-- 그림 안내는 꼭 필요한 키 하나에만 남긴다. 칸마다 달아 두면 설명이 세 배가 된다. -->
          <div class="dw-collapsible app-howto" data-open="false">
            <button type="button" class="dw-collapsible-trigger" aria-expanded="false" aria-controls="howto-keys">
              OpenRouter 키 받는 법 그림으로 보기
              <svg class="dw-collapsible-chevron" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="dw-collapsible-region" id="howto-keys" inert>
              <div class="dw-collapsible-content">
                <ol>
                  <li>링크를 눌러 로그인(구글 계정 가능)합니다.</li>
                  <li>Keys 화면에서 <b>Create key</b>를 누릅니다.</li>
                  <li><code>sk-or-</code>로 시작하는 긴 글자가 <b>한 번만</b> 보입니다 — 바로 복사하세요.</li>
                </ol>
                <svg viewBox="0 0 520 110" role="img" aria-label="OpenRouter 키 발급 순서 그림">
                  <rect class="face" x="8" y="20" width="130" height="70" rx="8"/>
                  <text x="73" y="48" text-anchor="middle" font-size="11">openrouter.ai/keys</text>
                  <rect class="cta" x="30" y="58" width="86" height="20" rx="4"/>
                  <text class="on-cta" x="73" y="72" text-anchor="middle" font-size="10">Create key</text>
                  <text class="arrow" x="153" y="60" font-size="16">→</text>
                  <rect class="face" x="175" y="20" width="150" height="70" rx="8"/>
                  <text x="250" y="48" text-anchor="middle" font-size="11">키가 한 번만 보임</text>
                  <rect class="field" x="190" y="58" width="120" height="20" rx="4"/>
                  <text x="250" y="72" text-anchor="middle" font-size="10">sk-or-v1-…  [복사]</text>
                  <text class="arrow" x="340" y="60" font-size="16">→</text>
                  <rect class="goal" x="362" y="20" width="150" height="70" rx="8"/>
                  <text x="437" y="48" text-anchor="middle" font-size="11">이 화면의 칸에 붙여넣기</text>
                  <rect class="field" x="377" y="58" width="120" height="20" rx="4"/>
                  <text x="437" y="72" text-anchor="middle" font-size="10">●●●●●●●●</text>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 남은 설정은 다른 검사 키뿐이다 — 있으면 넣고, 없으면 접힌 채 그대로 두면 된다.
           고를 것(속도·검사 켜고 끄기)은 전부 화면에서 뺐다: 속도는 막히면 스스로
           늦추고, 바이러스토탈은 키가 있으면 서버가 알아서 켠다. -->
      <section class="dw-block-settings-group">
        <div class="dw-block-settings-rows">
          <div class="dw-collapsible" data-open="false">
            <button type="button" class="dw-collapsible-trigger" aria-expanded="false" aria-controls="advanced">
              다른 검사 키
              <svg class="dw-collapsible-chevron" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="dw-collapsible-region" id="advanced" inert>
              <div class="dw-collapsible-content">
                <div class="dw-field-group">
                  <!-- 이 둘은 없어도 검사가 그대로 돈다. 키가 없으면 파이프라인이 무료 공개
                       자료로 갈아 끼운다(pipeline.py `_index_check` · config.py `free_fallbacks`).
                       예전 문구는 "없으면 필수 검사를 못 한다"였는데 그건 지금 코드와 다르다. -->
                  <div class="dw-field">
                    <label class="dw-label" for="k_serper">Serper 키</label>
                    <div class="dw-field-content">
                      <input type="password" class="dw-input" id="k_serper" autocomplete="off"
                             aria-describedby="k_serper-desc">
                      <p class="dw-field-description" id="k_serper-desc"><a href="https://serper.dev/api-key" target="_blank" rel="noopener">serper.dev/api-key</a></p>
                    </div>
                  </div>

                  <div class="dw-field">
                    <label class="dw-label" for="k_openpagerank">Open PageRank 키</label>
                    <div class="dw-field-content">
                      <input type="password" class="dw-input" id="k_openpagerank" autocomplete="off"
                             aria-describedby="k_openpagerank-desc">
                      <p class="dw-field-description" id="k_openpagerank-desc"><a href="https://www.domcop.com/openpagerank/" target="_blank" rel="noopener">domcop.com/openpagerank</a></p>
                    </div>
                  </div>

                  <div class="dw-field">
                    <label class="dw-label" for="k_safebrowsing">구글 세이프 브라우징 키</label>
                    <div class="dw-field-content">
                      <input type="password" class="dw-input" id="k_safebrowsing" autocomplete="off">
                    </div>
                  </div>

                  <div class="dw-field">
                    <label class="dw-label" for="k_virustotal">바이러스토탈 키</label>
                    <div class="dw-field-content">
                      <input type="password" class="dw-input" id="k_virustotal" autocomplete="off">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div class="app-actions">
        <!-- 저장 단추도 없앴다 — 키를 붙여넣으면 잠깐 뒤 저절로 저장된다 -->
        <p class="muted" id="cfgMsg" role="status"></p>
      </div>

      <!-- 내 기록을 내가 지울 수 있어야 한다 — 못 미더운 사람이 제일 먼저 찾는 단추 -->
      <section class="dw-block-settings-group">
        <h2 class="dw-block-settings-group-title">지우기</h2>
        <div class="app-actions">
          <button type="button" class="dw-button" data-variant="secondary" data-block
                  id="clearKeys">저장된 키 전부 빼기</button>
          <button type="button" class="dw-button" data-variant="secondary" data-block
                  id="clearResults">검사 결과 전부 지우기</button>
        </div>
      </section>
    </div>
  </section>

  </main>

  <!-- 검사 상태 자리 — 목록 안이 아니라 도크 바로 위에 붙는다. 검사는 어느 화면을
       보고 있든 도는 일이라, 목록 맨 위에 두면 화면을 옮길 때마다 사라져 버린다.
       두 줄은 서로 엇갈려 뜬다 — 도는 중이면 진행 줄, 멈춰 있으면 이어서 검사 줄. -->
  <div class="app-resume" id="resumeRow" role="status" hidden></div>

  <div class="app-runbar" id="runbar" hidden>
    <div class="dw-progress">
      <span class="dw-progress-label" id="progressText" aria-live="polite">준비 중…</span>
      <span class="dw-progress-value" id="progressPct" data-numeric></span>
      <div class="dw-progress-track" role="progressbar" id="track"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="progressText">
        <div class="dw-progress-indicator" id="bar" aria-hidden="true" style="width:0%"></div>
      </div>
    </div>
    <button type="button" class="dw-button" data-variant="secondary" data-size="sm" id="stop">중단</button>
  </div>

  <!-- doweek 의 떠 있는 도크 — 흰 알약 한 장이 배경 위에 뜨고, 고른 칸에는 둥근
       틴트가 깔리며 그림이 살짝 위로 올라간다. 넣기 단추는 doweek 그대로 도크
       한가운데 위 테에 반쯤 파묻혀 앉는 둥근 + 단추다
       (원본: Z:\Doweek\src\shared\components\BottomNav.jsx 의 .dock-fab) -->
  <nav class="dock-nav" aria-label="화면 이동">
    <div class="dock-wrap">
      <button type="button" class="dock-fab" id="addFab" aria-label="도메인 넣기">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      </button>
      <div class="dock-glass">
        <div class="dock-page" style="--dock-cols:3">
          <button type="button" class="dock-item" data-go="list" data-current="true" aria-current="page">
            <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/>
              <path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>
            </svg>
            <span class="dock-label">살 것</span>
            <span class="dock-badge" id="badgeList" hidden></span>
          </button>
          <!-- 주인 있는 것은 살 수 없으니 여기로 빠진다. 개수만 알면 들어가 볼 일이
               없으므로 칸 위에 개수를 붙여 둔다. -->
          <button type="button" class="dock-item" data-go="taken">
            <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span class="dock-label">남의 것</span>
            <span class="dock-badge" id="badgeTaken" hidden></span>
          </button>
          <button type="button" class="dock-item" data-go="settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span class="dock-label">설정</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

</div>

<!-- ③ 넣는 판 — 목록 위를 덮는다. 붙여넣고 시작하면 사라진다. -->
<div class="app-sheet" id="sheetInput" role="dialog" aria-modal="true" aria-labelledby="sheetInputTitle" hidden>
  <div class="app-sheet-panel">
    <div class="modal-handle" aria-hidden="true"></div>
    <header class="dw-block-shell-bar">
      <span class="dw-block-shell-action">
        <button type="button" class="dw-button" data-variant="ghost" data-icon id="closeInput" aria-label="닫기">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </span>
      <h2 class="dw-block-shell-title" id="sheetInputTitle">도메인 넣기</h2>
      <!-- 파일에서 가져오기 — 폭을 다 먹던 글자 단추 대신 클립 아이콘 하나 -->
      <span class="dw-block-shell-action">
        <input type="file" id="file" class="dw-sr-only app-file-input" accept=".txt,.csv,text/plain">
        <label for="file" class="dw-button app-file-label" data-variant="ghost" data-icon
               aria-label="글자 파일에서 가져오기 (.txt · .csv)" title="글자 파일에서 가져오기 (.txt · .csv)">
          <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true"><path d="M13.234 20.252 21 12.3"/>
            <path d="m16 6-8.414 8.586a2 2 0 0 0 0 2.828 2 2 0 0 0 2.828 0l8.414-8.586a4 4 0 0 0-5.657-5.656l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/></svg>
        </label>
      </span>
    </header>

    <div class="app-sheet-body">
      <div class="app-paste">
        <label class="dw-label dw-sr-only" for="raw">검사할 도메인 붙여넣기</label>
        <textarea id="raw" class="dw-textarea"
          placeholder="example.com&#10;another-site.co.kr&#10;third.net"></textarea>
      </div>

      <div class="app-file-row">
        <p class="muted" id="fileName" hidden></p>
        <p class="dw-field-error" id="fileMsg" role="alert" hidden></p>
      </div>
    </div>

    <footer class="app-sheet-foot">
      <p class="app-tape" id="preview" role="status" hidden></p>
      <button type="button" class="dw-button" data-variant="primary" data-size="lg" data-block
              id="start">검사 시작</button>
    </footer>
  </div>
</div>

<!-- ④ 상세 — 목록 줄을 누르면 위로 덮인다. 맨 위 한 마디가 답이고, 나머지는 접혀 있다. -->
<div class="app-sheet" id="sheetDetail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
  <div class="app-sheet-panel">
    <div class="modal-handle" aria-hidden="true"></div>
    <header class="dw-block-shell-bar">
      <span class="dw-block-shell-action">
        <button type="button" class="dw-button" data-variant="ghost" data-icon id="closeDetail" aria-label="목록으로">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </button>
      </span>
      <h2 class="dw-block-shell-title" id="detailTitle"></h2>
      <!-- 수백 개를 훑는 도구다 — 한 건 볼 때마다 목록으로 돌아가지 않게 옆으로 넘긴다 -->
      <span class="dw-block-shell-action">
        <button type="button" class="dw-button" data-variant="ghost" data-icon id="detailPrev" aria-label="이전 도메인">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button type="button" class="dw-button" data-variant="ghost" data-icon id="detailNext" aria-label="다음 도메인">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </span>
    </header>

    <div class="app-sheet-body">
      <div class="app-call" id="detailCall">
        <span class="app-call-mark" id="detailMark"></span>
        <p class="app-call-sub" id="detailSub"></p>
      </div>

      <ol class="app-why" id="detailWhy"></ol>

      <div class="dw-collapsible" id="detailMoreBox" data-open="false">
        <button type="button" class="dw-collapsible-trigger" aria-expanded="false" aria-controls="detailMore">
          점수 내역 · 못 본 검사 보기
          <svg class="dw-collapsible-chevron" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="dw-collapsible-region" id="detailMore" inert>
          <div class="dw-collapsible-content">
            <div id="detailBody" class="dw-prose"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const rows = new Map();
let source = null;
let resumable = false;   // 중단된 목록이 남아 있나 (서버 run_state.json 기준)
let running = false;
let failed = [];         // 검사 도중 터져서 결과가 없는 도메인
let startedAt = 0;       // 이번 검사를 지켜보기 시작한 시각 — 남은 시간 계산용
let doneBase = 0;        // 그때 이미 끝나 있던 개수(중간에 다시 붙어도 시간이 안 틀리게)

/* DW 부품이 아이콘 자리를 전제로 만들어졌는데 이 앱에는 번들러가 없다.
   lucide(ISC) 원본 path 를 그대로 인라인해 쓴다. */
const ICON = (paths, size, cls) =>
  '<svg class="' + cls + '" xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size +
  '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
  'stroke-linejoin="round" aria-hidden="true">' + paths + "</svg>";
const ICON_WARNING = ICON('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/>' +
  '<path d="M12 9v4"/><path d="M12 17h.01"/>', 20, "dw-alert-icon");
const ICON_INFO = ICON('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  20, "dw-alert-icon");
const ICON_CHEVRON = ICON('<path d="m9 18 6-6-6-6"/>', 20, "");
/* 목록 한 줄은 글자 대신 그림으로 말한다 — 수백 줄을 훑는 자리라 문장이 있으면
   눈이 읽느라 멈춘다. 뜻은 그림에 얹은 설명 글(aria-label)이 지고, 문장은 상세에서 읽는다. */
const ICON_CHECK = ICON('<path d="M20 6 9 17l-5-5"/>', 18, "");
const ICON_QUESTION = ICON('<circle cx="12" cy="12" r="10"/>' +
  '<path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>', 18, "");
const ICON_X = ICON('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 18, "");
const ICON_UNLOCK = ICON('<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>' +
  '<path d="M7 11V7a5 5 0 0 1 9.9-1"/>', 14, "");
const ICON_CLOCK = ICON('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>', 14, "");
const ICON_CALENDAR = ICON('<path d="M8 2v4"/><path d="M16 2v4"/>' +
  '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>', 14, "");
/* 판정 도장 — 살 것 ✓ · 검토 ? · 제외 ✕ */
const VERDICT_ICON = {BUY: ICON_CHECK, REVIEW: ICON_QUESTION, REJECT: ICON_X};
/* 살 수 있나 — '바로 가능'은 그림만으로 충분하고, 나머지 셋만 짧은 글자를 붙인다 */
/* 확인 못 한 것은 점선 동그라미 — 판정의 물음표와 같은 그림을 쓰면 한 줄에 물음표가
   둘 서서 어느 쪽 이야기인지 헷갈린다 */
const ICON_DASHED = ICON('<circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/>', 14, "");
const AVAIL_ICON = {free: ICON_UNLOCK, soon: ICON_CLOCK, auction: ICON_CLOCK, unknown: ICON_DASHED};
const AVAIL_SHORT = {free: "", soon: "곧", auction: "경매", unknown: "미확인"};

/* 화면에 이모지를 쓰지 않는 것이 DW 규칙인데, 한줄평·AI 소견은 우리가 쓴 글이 아니라
   AI 가 써 보낸 글이고 예전에 저장해 둔 결과에도 옛 문구가 남아 있다. 글자를 화면에
   내보내는 길목 한 곳에서 지운다(보고서 쪽도 같은 일을 한다).
   화살표(→)는 남긴다 — "정상→위험" 처럼 뜻을 나르는 자리에 쓰고 있다. */
const EMOJI = /[\u{1F000}-\u{1FAFF}☀-➿⬀-⯿️⃣]/gu;
function escapeHtml(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(EMOJI, "").replace(/[ \t]{2,}/g, " ").trim()
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ── 옛 저장분의 거짓말 한 줄을 바로잡는다 ──────────────────────────────────
   예전 판은 Serper·Open PageRank·OpenRouter 키가 없으면 "필수 검사라 매입 후보 판정
   불가"라고 적어 저장했다. 지금은 판정을 막는 키가 하나도 없다 — 필수 검사 다섯 개가
   전부 키 없이 돈다(pipeline.py `_index_check` 는 키가 없으면 freeindex 로 가고,
   models.py `REQUIRED_CHECKS` 에서 AI·권위 점수는 선택으로 빠졌다).
   설정 화면과 상세 화면이 서로 다른 말을 하지 않도록, 글자가 화면에 나가는 이 길목
   한 곳에서 그 꼬리말만 사실대로 갈아 끼운다. 저장된 파일은 건드리지 않는다. */
const STALE_KEY_NOTE = /(Serper|Open PageRank|OpenRouter) 키가 없어([^()]*)\(필수 검사라[^)]*\)/g;
const STALE_TAIL = {
  "Serper": "(지금은 키 없이 공개 크롤 기록과 현재 페이지로 대신 봅니다 — 옛 저장분)",
  "Open PageRank": "(지금은 판정에 쓰지 않는 보조 지표입니다 — 옛 저장분)",
  "OpenRouter": "(지금은 규칙 검사만으로도 판정이 나옵니다 — 옛 저장분)"
};
function freshen(text) {
  return String(text === undefined || text === null ? "" : text).replace(
    STALE_KEY_NOTE,
    (all, key, middle) => key + " 키가 없어" + middle + STALE_TAIL[key]
  );
}

/* ---------- 화면 전환 (doweek 도크) ---------- */
const navTabs = [...document.querySelectorAll(".dock-item")];
navTabs.forEach((b) => { b.onclick = () => show(b.dataset.go); });
let screenNow = "list";
function show(name) {
  const changed = name !== screenNow;
  screenNow = name;
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === name));
  navTabs.forEach((b) => {
    const on = b.dataset.go === name;
    if (on) { b.dataset.current = "true"; b.setAttribute("aria-current", "page"); }
    else { delete b.dataset.current; b.removeAttribute("aria-current"); }
  });
  // 넣기 단추는 결과를 보는 두 화면의 것이다. 검사가 도는 동안에도 열어 둔다 —
  // 다음 묶음을 대기줄에 세울 수 있어야 1.5시간마다 폰을 다시 안 본다.
  $("addFab").hidden = name === "settings";
  showFilterHeader();
  // 구르는 것은 페이지가 아니라 뼈대의 가운데 칸이다
  $("main").scrollTop = 0;
  // 사람이 탭을 눌러 바꾼 것일 때만 발자국을 남긴다 — 뒤로가기가 이 발자국을 밟는다
  if (changed && !syncingFromPopstate) history.pushState({screen: name, sheet: null}, "");
}
function showFilterHeader() {
  // 판정 거르개는 살 것 화면의 물건이다 — 남의 것에는 판정을 매기지 않는다
  $("filterHeader").hidden = !(screenNow === "list" && freeRows().length > 0);
}

/* ---------- 덮는 판 (넣기·상세) ----------
   판이 열려 있는 동안 뒤 화면은 눈에도 안 보이고 Tab 으로도 안 들어간다. */
let sheetNow = null;
let sheetOpener = null;   // 판을 연 단추 — 닫으면 커서가 여기로 돌아간다
function openSheet(id, focusId) {
  // 판 안에서 다음/이전으로 옮겨 다닐 때는 처음 연 자리를 그대로 기억한다
  const alreadyOpen = sheetNow === id;
  if (!sheetNow) sheetOpener = document.activeElement;
  sheetNow = id;
  $(id).hidden = false;
  $("shell").inert = true;
  const target = $(focusId);
  if (target) target.focus({preventScroll: true});
  // 이미 열린 판 안에서 도메인만 옆으로 넘기는 것이면 발자국을 또 남기지 않는다
  if (!alreadyOpen && !syncingFromPopstate) history.pushState({screen: screenNow, sheet: id}, "");
}
function closeSheet() {
  if (!sheetNow) return;
  $(sheetNow).hidden = true;
  sheetNow = null;
  $("shell").inert = false;
  // 300번째 줄을 열었다 닫아도 맨 위부터 다시 Tab 하지 않게, 연 자리로 돌려보낸다
  if (sheetOpener && sheetOpener.isConnected) sheetOpener.focus({preventScroll: true});
  sheetOpener = null;
  // 사람이 닫기를 눌러 닫은 것이면, 열 때 남긴 발자국도 지운다(뒤로가기 한 번 몫)
  if (!syncingFromPopstate) history.back();
}

/* ---------- 뒤로가기로 메뉴·판 되돌리기 ----------
   여기서 화면을 바꾸거나 판을 열어도 브라우저는 그걸 모른다. 그래서 설정 화면이나
   상세 판을 보다가 (휴대폰이나 브라우저의) 뒤로가기를 누르면 메뉴가 이전 자리로
   안 돌아가고 페이지 자체가 통째로 닫혀 버린다. 화면·판을 바꿀 때마다 발자국을
   하나씩 남기고, 뒤로가기를 누르면 그 발자국을 밟고 이전 메뉴·판으로 돌아온다. */
let syncingFromPopstate = false;
history.replaceState({screen: screenNow, sheet: sheetNow}, "");
window.addEventListener("popstate", (e) => {
  syncingFromPopstate = true;
  const state = e.state || {screen: "list", sheet: null};
  if (sheetNow && sheetNow !== state.sheet) closeSheet();
  if (state.sheet && state.sheet !== sheetNow) {
    openSheet(state.sheet, state.sheet === "sheetDetail" ? "closeDetail" : "raw");
  }
  if (state.screen && state.screen !== screenNow) show(state.screen);
  syncingFromPopstate = false;
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && sheetNow) { e.preventDefault(); closeSheet(); }
  // 상세가 열려 있을 때 좌우 화살표 = 이전/다음 도메인 (글 쓰는 칸 안에서는 안 뺏는다)
  if (sheetNow === "sheetDetail" && (e.key === "ArrowLeft" || e.key === "ArrowRight") &&
      !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    e.preventDefault();
    stepDetail(e.key === "ArrowRight" ? 1 : -1);
  }
});
// 판 위에 남는 어두운 덮개를 누르면 닫힌다 — doweek 원본과 같은 손버릇
["sheetInput", "sheetDetail"].forEach((id) => {
  $(id).addEventListener("click", (e) => { if (e.target === $(id)) closeSheet(); });
});
$("addFab").onclick = () => openSheet("sheetInput", "raw");
$("emptyStart").onclick = () => openSheet("sheetInput", "raw");
$("closeInput").onclick = closeSheet;
$("closeDetail").onclick = closeSheet;

/* ---------- 접었다 펴는 칸 (DW collapsible) ---------- */
function setOpen(box, open) {
  box.dataset.open = open ? "true" : "false";
  box.querySelector(".dw-collapsible-trigger").setAttribute("aria-expanded", open ? "true" : "false");
  // 접힌 동안에는 눈에도 안 보이고 Tab 으로도 못 들어가야 한다
  const region = box.querySelector(".dw-collapsible-region");
  if (open) region.removeAttribute("inert"); else region.setAttribute("inert", "");
}
document.querySelectorAll(".dw-collapsible-trigger").forEach((trigger) => {
  trigger.onclick = () => {
    const box = trigger.closest(".dw-collapsible");
    setOpen(box, box.dataset.open !== "true");
  };
});

/* ---------- 넣는 판: 붙여넣기 · 파일 · 한 줄 요약 ---------- */
let timer = null;
$("raw").addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(preview, 400);
});
/* 글자 파일이 아닌 것(사진·엑셀·zip)을 부으면 칸이 깨진 기호로 가득 찬다.
   확장자와 "읽어 보니 깨진 글자 비율"을 함께 보고 막는다. */
const BAD_FILE_MSG = "글자 파일(.txt, .csv)만 올릴 수 있습니다.";
const BROKEN_LIMIT = 0.01;  // 읽은 내용의 1%가 깨져 있으면 글자 파일이 아니다

function fileError() {
  $("fileMsg").textContent = BAD_FILE_MSG;
  $("fileMsg").hidden = false;
  $("fileName").hidden = true;
  $("file").value = "";
}
$("file").addEventListener("change", (e) => {
  $("fileMsg").hidden = true;
  const file = e.target.files[0];
  if (!file) return;
  if (!/\.(txt|csv)$/i.test(file.name)) { fileError(); return; }
  const reader = new FileReader();
  reader.onerror = fileError;
  reader.onload = () => {
    const text = String(reader.result || "");
    const broken = (text.match(/�/g) || []).length;  // 글자로 못 읽은 자리
    if (text.length && broken / text.length > BROKEN_LIMIT) { fileError(); return; }
    $("raw").value = text;
    $("fileName").textContent = file.name;
    $("fileName").hidden = false;
    preview();
  };
  reader.readAsText(file, "utf-8");
});

/* 붙여넣는 즉시 한 줄만 뜬다 — 개수 · 걸리는 시간 · 드는 돈.
   서버가 보내는 estimate 에서 그 셋만 뽑아 잇는다(자세한 설명은 넣지 않는다). */
function money(quota) {
  const line = (quota || []).find((t) => t.indexOf("AI 분석") === 0) || "";
  const won = /약 ([\d,]+)원/.exec(line);
  if (won) return "약 " + won[1] + "원";
  return line.indexOf("몇 원 수준") >= 0 ? "몇 원" : "";
}
function minutes(value) {
  if (!value || value < 1) return "1분 안쪽";
  if (value < 60) return "약 " + Math.round(value) + "분";
  return "약 " + (value / 60).toFixed(1) + "시간";
}
async function preview() {
  const raw = $("raw").value.trim();
  if (!raw) { $("preview").textContent = ""; $("preview").hidden = true; $("start").disabled = running; return; }
  // 서버가 답을 못 주면 미리보기만 조용히 접는다 — 입력한 글은 그대로 둔다.
  let data;
  try {
    const res = await fetch("/api/preview", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({raw})
    });
    if (!res.ok) throw new Error("preview failed");
    data = await res.json();
  } catch (err) {
    $("preview").textContent = ""; $("preview").hidden = true; return;
  }
  const estimate = data.estimate || {};
  if (!estimate.count) {
    // 왜 못 쓰는지 버린 줄을 그대로 보여 준다 — "없습니다"만 우기면 고장으로 읽힌다
    const bad = (data.invalid || []).slice(0, 3).join(", ");
    $("preview").textContent = "검사할 도메인이 없습니다." +
      (bad ? "\n도메인 모양이 아니라 건너뜀: " + bad : "");
    $("preview").hidden = false;
    $("start").disabled = true;  // 검사할 게 없으면 시작 단추도 꺼 둔다
    return;
  }
  $("start").disabled = running;
  const bits = [estimate.count + "개", minutes(estimate.minutes), money(estimate.quota)];
  if (data.truncated) bits.push("이번엔 앞 " + estimate.count + "개만");
  let text = bits.filter(Boolean).join(" · ");
  // 몇 개를 왜 버렸는지 이름까지 보여 준다 — 개수만 적으면 산수가 안 맞아 보인다
  if ((data.invalid || []).length) {
    text += "\n도메인 모양이 아니라 건너뜀 " + data.invalid.length + "개: " +
      data.invalid.slice(0, 3).join(", ") + (data.invalid.length > 3 ? " …" : "");
  }
  $("preview").textContent = text;
  $("preview").hidden = false;
}

/* ---------- 검사 실행 ---------- */
$("start").onclick = async () => {
  const raw = $("raw").value.trim();
  if (!raw) { $("raw").focus(); alert("검사할 도메인을 넣어 주세요."); return; }
  const res = await fetch("/api/run", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({raw, use_cache: true})
  });
  // 시작이 확정된 뒤에 목록을 비운다 — 실수로 눌러 거절당했을 때 지난 결과가 사라지면 안 된다.
  if (!res.ok) { alert((await res.json()).detail || "시작하지 못했습니다."); return; }
  const data = await res.json();
  $("raw").value = "";
  $("file").value = "";
  $("fileName").hidden = true;
  $("preview").hidden = true;
  // 검사가 도는 중이었으면 줄만 세운 것이다 — 지금 보고 있는 결과를 지우면 안 된다.
  if (data.queued) {
    closeSheet();
    $("progressText").textContent =
      "대기줄에 " + data.count + "개를 세웠습니다 — 지금 검사가 끝나면 자동으로 이어서 돕니다.";
    return;
  }
  // 지난 결과는 지우지 않는다 — 묶음을 나눠 검사해도 목록은 쌓인다.
  // 같은 도메인을 다시 검사하면 addRow 가 그 줄만 최신으로 갈아 끼운다.
  // 결과는 살 것 화면에 쌓인다 — 다른 화면에서 시작했으면 그 화면으로 데려간다.
  // 안 데려가면 남의 것 화면을 보면서 "아무 일도 안 일어나네" 하고 있게 된다.
  // 판을 닫으면 브라우저가 발자국을 한 칸 되밟으므로, 그 되밟기가 끝난 뒤에 옮긴다.
  // 먼저 옮기면 되밟기가 방금 옮긴 화면을 도로 끌고 간다.
  const goList = screenNow !== "list";
  closeSheet();
  if (goList) window.addEventListener("popstate", () => show("list"), {once: true});
  countVisible();
  resumable = true;
  listen();
};
$("stop").onclick = async () => {
  await fetch("/api/stop", {method: "POST"});
  $("progressText").textContent = "중단했습니다.";
};
async function doResume() {
  const res = await fetch("/api/resume", {method: "POST"});
  if (!res.ok) { alert((await res.json()).detail || "이어서 검사할 수 없습니다."); return; }
  listen();
}

function listen() {
  if (source) source.close();
  startedAt = 0;
  failed = [];
  source = new EventSource("/api/events");
  source.onmessage = (e) => handle(JSON.parse(e.data));
  source.onerror = () => { /* 서버가 스트림을 닫으면 브라우저가 알아서 다시 붙는다 */ };
}

function handle(ev) {
  if (ev.type === "snapshot") { markStart(ev.done); setRunning(ev.running); progress(ev.done, ev.total); return; }
  if (ev.type === "start") { markStart(0); setRunning(true); progress(0, ev.total); return; }
  if (ev.type === "domain_start") { $("progressText").textContent = ev.domain + " 검사 중… (" + ev.done + "/" + ev.total + ")"; return; }
  // 서버가 보내는 done 은 이 도메인까지 센 값이다 — 여기서 1을 더하면 100%를 넘는다.
  if (ev.type === "domain_done") { addRow(ev.result, ev.cached); progress(ev.done, ev.total); return; }
  if (ev.type === "capture_start") { $("progressText").textContent = "결과는 다 나왔습니다. 이제 화면 사진 " + ev.count + "개를 찍습니다…"; return; }
  if (ev.type === "capture_done") {
    // 사진이 붙은 최신 결과가 함께 온다 — 목록을 갈아 끼워야 상세에서 캡쳐가 보인다.
    if (ev.result) addRow(ev.result, false);
    $("progressText").textContent = ev.domain + " 사진 " + ev.shots + "장 저장.";
    return;
  }
  // 한 도메인이 터져도 나머지는 계속 간다. 어느 것이 빠졌는지는 반드시 알려 준다.
  if (ev.type === "domain_failed") { failed.push(ev.domain); progress(ev.done, ev.total); return; }
  if (ev.type === "finished") {
    resumable = Boolean(ev.stopped);  // 끝까지 갔으면 이어서 할 것이 없다
    // 이름은 서버가 보낸 목록을 먼저 쓴다 — 중간에 새로고침하면 이 페이지가 직접 본
    // 목록은 비어 있어서, 개수만 세고 이름 자리가 빈칸으로 나가던 문제가 있었다.
    const missed = (ev.failed && ev.failed.length ? ev.failed : failed);
    if (missed.length) resumable = true;
    setRunning(false);
    showResume(missed);
    applyView();  // 다 나왔으니 살 수 있는 것부터 줄을 세운다
    if (source) source.close();
    // 대기줄에 세워 둔 다음 묶음이 있으면 서버가 곧 이어서 시작한다 — 다시 붙는다
    setTimeout(async () => {
      try {
        const s = await (await fetch("/api/status")).json();
        if (s.running) { setRunning(true); listen(); }
      } catch (err) { /* 서버가 잠깐 말이 없으면 다음 새로고침 때 붙는다 */ }
    }, 800);
    return;
  }
  if (ev.type === "error") {
    setRunning(false);
    alert("오류: " + ev.message);
    if (source) source.close();
  }
  // report_ready · report_error 는 더 쓰지 않는다 — 결과 보는 길을 목록·CSV 둘로 줄였다.
}

function setRunning(on) {
  running = on;
  $("runbar").hidden = !on;
  // 도는 동안에도 넣기 판은 쓸 수 있다 — 대신 단추가 "대기줄에 넣기"로 바뀐다
  // (폰 폭에서 한 줄에 서게 짧게. 자동으로 이어진다는 말은 누른 뒤 진행 줄이 해 준다)
  $("start").textContent = on ? "대기줄에 넣기" : "검사 시작";
  $("addFab").hidden = screenNow === "settings";
  showResume([]);
}
/* 중단된 것이 남아 있을 때만 도크 위에 한 줄이 뜬다(평소엔 아예 없다). */
function showResume(missed) {
  const box = $("resumeRow");
  if (running || !resumable) { box.hidden = true; return; }
  const tail = (missed && missed.length)
    ? "검사하지 못한 " + missed.length + "개가 있습니다."
    : "중단된 검사가 남아 있습니다.";
  box.innerHTML = '<div class="dw-alert" data-variant="info">' + ICON_INFO +
    '<p class="dw-alert-description">' + escapeHtml(tail) + "</p>" +
    '<div class="dw-alert-action"><button type="button" class="dw-button" data-variant="secondary" ' +
    'data-size="sm" id="resume">이어서 검사</button></div></div>';
  $("resume").onclick = doResume;
  box.hidden = false;
}
/* 검사 중간에 화면을 다시 열면 그 시점부터 다시 잰다(예전 것까지 세면 시간이 틀린다). */
function markStart(done) {
  if (startedAt) return;
  startedAt = Date.now();
  doneBase = done || 0;
}
/* 지금까지 걸린 시간을 남은 개수에 그대로 늘려 잡는다(잰 게 없으면 알 수 없으니 생략). */
function etaText(done, total) {
  const measured = done - doneBase;
  if (!startedAt || measured <= 0 || done >= total) return "";
  const left = ((Date.now() - startedAt) / 60000) / measured * (total - done);
  return " · 남은 시간 " + (left < 1 ? "1분 안쪽" : "약 " + Math.round(left) + "분");
}
function progress(done, total) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  $("bar").style.width = pct + "%";
  $("track").setAttribute("aria-valuenow", pct);
  // 퍼센트는 DW progress 의 값 칸이 든다(막대 오른쪽 위) — 설명 줄과 겹쳐 적지 않는다
  $("progressPct").textContent = total ? pct + "%" : "";
  if (total) $("progressText").textContent = done + " / " + total + "개" + etaText(done, total);
}

/* 언제 검사한 저장분인지 안 적으면 묵은 답을 오늘 것으로 읽는다. */
function when(stamp) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(stamp || ""));
  return m ? Number(m[1]) + "년 " + Number(m[2]) + "월 " + Number(m[3]) + "일" : "언제인지 모를 때";
}

const BUYABLE = {free: true, soon: true, auction: true};
const BUY_RANK = {free: 0, soon: 1, auction: 2, unknown: 3, taken: 4};

/* 못 본 검사는 점수 셈에서 빠진다 — 그래서 점수마다 잣대가 다를 수 있다.
   "참고치"라고만 쓰면 왜 참고인지 모르니, 몇 개 중 몇 개를 보고 낸 점수인지 적는다. */
function scoreText(result) {
  if (result.score === null || result.score === undefined) return "";
  if (!result.partial_score) return Math.round(result.score) + "점";
  const items = (result.scoring && result.scoring.items) || [];
  const seen = items.filter((i) => i.earned !== null && i.earned !== undefined).length;
  const basis = items.length ? seen + "/" + items.length + " 검사" : "참고치";
  return Math.round(result.score) + "점(" + basis + ")";
}

/* 만료일 — 낙장 장사의 시계다. 저장분에 이미 들어 있는데 안 보여 주면
   "시계 없는 시계방"이 된다. 날짜 열 자만 자른다. */
function expiresText(result) {
  const raw = (result.registration && result.registration.expires) || "";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(raw));
  return m ? "만료 " + m[1] + "." + Number(m[2]) + "." + Number(m[3]) : "";
}
/* 목록 줄에 쓰는 날짜 — 앞에 달력 그림이 서므로 "만료" 두 글자는 뺀다 */
function expiresShort(result) {
  return expiresText(result).replace(/^만료 /, "");
}
/* 만료일로 줄을 세울 때 쓰는 열쇠 — 날짜를 모르는 것은 맨 뒤로 보낸다 */
function expiresKey(result) {
  const raw = String((result.registration && result.registration.expires) || "");
  return /^\d{4}-\d{2}-\d{2}/.test(raw) ? raw.slice(0, 10) : "9999-99-99";
}

/* 주인이 있는 도메인인가 — 이 하나가 화면을 가른다. 검사 결과에서 제일 먼저
   갈리는 갈래이기도 하다(주인이 쥐고 있으면 아무리 좋아도 살 수가 없다). */
function isTaken(d) {
  return d.availability === "taken";
}
/* 살 것 화면에 놓일 줄 · 남의 것 화면에 놓일 줄 */
function freeRows() {
  return [...rows.values()].filter((e) => !isTaken(e.data));
}
function takenRows() {
  return [...rows.values()].filter((e) => isTaken(e.data));
}

/* 결과 한 줄 = DW list-item. 살 수 있는 것은 이름 · 판정 도장 · 점수까지 얹지만,
   남의 것은 살 수가 없으니 이름과 언제 풀리는지만 남긴다 — 점수도 판정도 안 적는다
   (읽어 봐야 쓸 데가 없는 글자는 훑는 눈을 느리게만 한다). */
function addRow(result, cached) {
  if (!result) return;
  let entry = rows.get(result.domain);
  let row;
  if (!entry) {
    row = document.createElement("button");
    row.type = "button";
    row.className = "dw-list-item";
    row.dataset.variant = "default";
    row.dataset.size = "default";
    row.dataset.domain = result.domain;
    row.onclick = () => openDetail(result.domain);
    entry = {el: row, data: result, order: rows.size};
    rows.set(result.domain, entry);
  } else {
    row = entry.el;
    entry.data = result;
  }
  const taken = isTaken(result);
  // doweek 의 할일 한 줄처럼 왼쪽에 판정 색 띠를 세운다(원본 .task-row 의 border-left)
  row.dataset.verdict = taken ? "TAKEN" : (VERDICT_GROUP[result.verdict] || "REVIEW");
  // 날짜 칸 — 앞에 달력 그림을 세우고 숫자만 남긴다
  const day = expiresShort(result);
  const dayChip = day
    ? '<span class="app-chip" role="img" aria-label="만료 ' + escapeHtml(day) + '" title="만료 ' +
      escapeHtml(day) + '">' + ICON_CALENDAR + escapeHtml(day) + "</span>"
    : "";
  if (taken) {
    row.innerHTML =
      '<span class="dw-list-item-content">' +
        '<span class="dw-list-item-title app-domain">' + escapeHtml(result.domain) + "</span>" +
        (dayChip ? '<span class="app-meta">' + dayChip + "</span>" : "") +
      "</span>" + ICON_CHEVRON;
  } else {
    // 한줄평(문장)은 상세로 내렸다 — 목록은 이름 · 그림 세 개만 남긴다
    const avail = AVAIL_ICON[result.availability] ? result.availability : "unknown";
    const group = VERDICT_GROUP[result.verdict] || "REVIEW";
    const availTip = escapeHtml(result.availability_label);
    const verdictTip = escapeHtml(result.verdict_label);
    row.innerHTML =
      '<span class="dw-list-item-content">' +
        '<span class="dw-list-item-title app-domain">' + escapeHtml(result.domain) + "</span>" +
        '<span class="app-meta">' +
          '<span class="app-chip" role="img" data-avail="' + avail + '" title="' + availTip +
            '" aria-label="' + availTip + '">' +
            AVAIL_ICON[avail] + escapeHtml(AVAIL_SHORT[avail]) + "</span>" +
          dayChip +
        "</span>" +
      "</span>" +
      '<span class="app-score" data-numeric title="' + escapeHtml(scoreText(result)) +
        '" aria-label="점수 ' + escapeHtml(scoreText(result)) + '">' +
        escapeHtml(String(Math.round(result.score))) + "</span>" +
      // role="img" 를 붙여야 읽어 주는 기계가 이 그림을 '뜻이 있는 한 덩이'로 읽는다
      '<span class="app-verdict" role="img" title="' + verdictTip + '" aria-label="판정 ' +
        verdictTip + '">' + (VERDICT_ICON[group] || ICON_QUESTION) + "</span>" +
      ICON_CHEVRON;
  }
  // 다시 검사해 주인이 생기거나 풀리면 줄이 통째로 다른 화면으로 건너간다
  const box = $(taken ? "takenRows" : "rows");
  if (row.parentNode !== box) box.appendChild(row);
  // 새로 들어온 줄도 지금 걸려 있는 거르개를 바로 따른다
  row.hidden = !taken && !passes(result);
  countVisible();
}

/* ---------- 고르기 ----------
   주인 있는 것은 아예 옆 화면으로 빠졌으므로, 여기 남은 줄은 전부 살 수 있는 것이다.
   그래서 눈이 좇을 축이 '판정 도장' 하나로 줄어든다. */
const VERDICT_GROUP = {BUY: "BUY", REVIEW: "REVIEW", NO_HISTORY: "REVIEW", REJECT: "REJECT"};
/* 줄 세우는 차례 — 살 것부터 위로 */
const VERDICT_RANK = {BUY: 0, REVIEW: 1, NO_HISTORY: 1, REJECT: 2};
let verdictFilter = "";   // "" = 전체
let searchNeedle = "";    // 찾기 칸의 글자 (소문자)

function passes(d) {
  if (searchNeedle && d.domain.toLowerCase().indexOf(searchNeedle) < 0) return false;
  if (verdictFilter && VERDICT_GROUP[d.verdict] !== verdictFilter) return false;
  return true;
}
$("q").addEventListener("input", () => {
  searchNeedle = $("q").value.trim().toLowerCase();
  applyView();
});
/* 지금 보고 있는 화면에서 눈에 띄는 줄을 놓인 차례 그대로 돌려준다 — 엑셀 뽑기도,
   상세에서 옆으로 넘기기도 이 차례를 따른다. */
function visibleRows() {
  return [...$(screenNow === "taken" ? "takenRows" : "rows").children]
    .filter((el) => !el.hidden)
    .map((el) => rows.get(el.dataset.domain))
    .filter(Boolean)
    .map((e) => e.data);
}
function countVisible() {
  countTabs();
  showFilterHeader();
  const free = freeRows();
  const taken = takenRows();
  // ── 살 것 화면
  // 내보내기 아이콘이 이 줄에 있으니, 살 것이 있으면 늘 보인다
  $("searchRow").hidden = free.length === 0;
  $("emptyRows").hidden = rows.size > 0;
  const anyVisible = [...$("rows").children].some((el) => !el.hidden);
  const empty = $("filterEmpty");
  // 걸러서 한 줄도 안 남으면 백지 대신 이유를 말한다
  if (rows.size > 0 && !anyVisible) {
    empty.textContent = searchNeedle
      ? '"' + searchNeedle + '" 이 들어간 도메인이 없습니다.'
      : free.length === 0
        ? "검사한 " + taken.length + "개가 모두 주인이 있습니다 — 아래 '남의 것' 칸에 모아 두었습니다."
        : "이 판정으로 걸린 것이 0개입니다.";
    empty.hidden = false;
  } else {
    empty.hidden = true;
  }
  // ── 남의 것 화면
  $("emptyTaken").hidden = taken.length > 0;
  $("takenActions").hidden = taken.length === 0;
  // ── 도크 칸에 붙는 개수 — 들어가 보지 않고도 몇 개인지 안다
  setDockBadge("badgeList", free.length);
  setDockBadge("badgeTaken", taken.length);
}
function setDockBadge(id, n) {
  const badge = $(id);
  badge.textContent = n > 99 ? "99+" : n;
  badge.hidden = n === 0;
}
/* doweek 필터 탭은 칸마다 몇 개인지를 작은 알약으로 함께 든다 — 살 것만 센다. */
function countTabs() {
  const all = freeRows().map((e) => e.data);
  verdictButtons.forEach((b) => {
    const want = b.dataset.verdict;
    const n = want ? all.filter((d) => VERDICT_GROUP[d.verdict] === want).length : all.length;
    const badge = b.querySelector(".tab-badge");
    badge.textContent = n;
    badge.hidden = n === 0;
  });
}
/* 거르고 줄을 다시 세운다. 화면을 통째로 다시 그리지 않고 이미 있는 줄만 옮긴다.
   차례는 하나로 고정했다 — 빨리 살 수 있는 것 먼저, 그다음 점수 높은 것 먼저. 고르는
   칸을 따로 두지 않는다(수백 번 하는 일에 고를 것이 하나 늘면 그만큼 느려진다). */
function applyView() {
  const free = freeRows();
  free.sort((a, b) => {
    // ① 빨리 살 수 있는 것 ② 판정 ③ 점수. 점수를 판정보다 앞세우면 90점짜리 "제외"가
    // 85점짜리 "매입 후보" 위로 올라와, 살 것을 고르는 일이 되레 느려진다.
    const byBuy = (BUY_RANK[a.data.availability] ?? 3) - (BUY_RANK[b.data.availability] ?? 3);
    if (byBuy) return byBuy;
    const byVerdict = (VERDICT_RANK[a.data.verdict] ?? 1) - (VERDICT_RANK[b.data.verdict] ?? 1);
    if (byVerdict) return byVerdict;
    const sa = a.data.score === null || a.data.score === undefined ? -1 : a.data.score;
    const sb = b.data.score === null || b.data.score === undefined ? -1 : b.data.score;
    return sb - sa || a.order - b.order;
  });
  const box = document.createDocumentFragment();
  free.forEach((entry) => {
    entry.el.hidden = !passes(entry.data);
    box.appendChild(entry.el);
  });
  $("rows").appendChild(box);
  // 남의 것은 풀리는 날이 가까운 것부터 — 이 화면에서 볼 것은 그 날짜 하나뿐이다
  const taken = takenRows();
  taken.sort((a, b) => {
    const ea = expiresKey(a.data);
    const eb = expiresKey(b.data);
    return ea === eb ? a.order - b.order : (ea < eb ? -1 : 1);
  });
  const takenBox = document.createDocumentFragment();
  taken.forEach((entry) => { entry.el.hidden = false; takenBox.appendChild(entry.el); });
  $("takenRows").appendChild(takenBox);
  countVisible();
}
const verdictButtons = [...document.querySelectorAll("#verdictFilter .sub-tab")];
/* 색칠된 알약이 고른 칸으로 미끄러진다 — 몇 번째 칸인지와 그 칸의 색을 띠에 알려 주면
   나머지는 CSS 가 한다(doweek 원본 MainLayout.jsx 와 같은 방식). */
function slidePill(button) {
  const bar = $("verdictFilter");
  bar.style.setProperty("--active-idx", verdictButtons.indexOf(button));
  bar.style.setProperty("--slider-bg", button.dataset.color);
}
verdictButtons.forEach((b) => {
  b.onclick = () => {
    verdictFilter = b.dataset.verdict;
    verdictButtons.forEach((one) => {
      const on = one === b;
      one.setAttribute("aria-checked", on ? "true" : "false");
      one.tabIndex = on ? 0 : -1;
    });
    slidePill(b);
    applyView();
  };
});
slidePill(verdictButtons[0]);
/* 띠 하나가 Tab 한 번 — 안에서는 화살표로 옮긴다(DW toggle-group 규칙). */
$("verdictFilter").addEventListener("keydown", (e) => {
  const keys = ["ArrowLeft", "ArrowRight", "Home", "End"];
  if (!keys.includes(e.key)) return;
  e.preventDefault();
  const from = verdictButtons.indexOf(document.activeElement);
  if (from < 0) return;
  let next;
  if (e.key === "Home") next = 0;
  else if (e.key === "End") next = verdictButtons.length - 1;
  else next = (from + (e.key === "ArrowRight" ? 1 : -1) + verdictButtons.length) % verdictButtons.length;
  verdictButtons.forEach((one, i) => { one.tabIndex = i === next ? 0 : -1; });
  verdictButtons[next].focus();
});
/* 남의 것 통째로 치우기 — 살 수 없는 줄이 쌓이면 다음 검사 때 눈만 어지럽다.
   지운 뒤 같은 도메인을 다시 넣으면 처음부터 다시 검사한다(저장분까지 지우므로). */
$("purgeTaken").onclick = async () => {
  const targets = takenRows().map((e) => e.data.domain);
  if (!targets.length) return;
  if (!confirm("주인 있는 도메인 " + targets.length + "개를 목록에서 지울까요? 되돌릴 수 없습니다.")) return;
  const res = await fetch("/api/results/purge", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({domains: targets})
  });
  if (!res.ok) {
    alert((await res.json()).detail || "지우지 못했습니다.");
    return;
  }
  targets.forEach((domain) => {
    const entry = rows.get(domain);
    if (entry) entry.el.remove();
    rows.delete(domain);
  });
  applyView();
  // 지운 줄은 "이어서 검사" 목록에서도 빠졌다 — 서버에 다시 물어 그 줄을 거둔다.
  // 안 물으면 눌러도 "이어서 검사할 목록이 없습니다"만 뜨는 죽은 단추가 남는다.
  try {
    const state = await (await fetch("/api/status")).json();
    resumable = Boolean(state.resumable);
    showResume([]);
  } catch (err) { /* 서버가 잠깐 말이 없으면 다음 새로고침 때 맞춰진다 */ }
};

/* 엑셀은 =,+,-,@ 로 시작하는 칸을 수식으로 실행한다 — 따옴표를 앞에 붙여 글자로 만든다. */
function csvCell(value) {
  let text = String(value === undefined || value === null ? "" : value);
  if (/^[=+\-@]/.test(text)) text = "'" + text;
  return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
}
const exportCsv = () => {
  const found = visibleRows();
  if (!found.length) { alert("내보낼 결과가 없습니다."); return; }
  const head = ["도메인", "판정", "지금 살 수 있나", "점수", "한줄평", "검사한 날"];
  const lines = [head].concat(found.map((d) => [
    d.domain, d.verdict_label, d.availability_label,
    d.score === null || d.score === undefined ? "" : Math.round(d.score),
    d.one_liner, when(d.finished_at)
  ]));
  const text = lines.map((cols) => cols.map(csvCell).join(",")).join("\r\n");
  // 맨 앞의 BOM 이 있어야 엑셀이 한글을 안 깨뜨린다
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob(["\ufeff" + text], {type: "text/csv;charset=utf-8"}));
  link.download = "도메인검사결과.csv";
  link.click();
  URL.revokeObjectURL(link.href);
};
$("csvTop").onclick = exportCsv;

/* ---------- 상세 ----------
   맨 위 한 마디가 답이다. 이유는 최대 셋. 점수 내역과 못 본 검사는 접어 둔다. */
const CALL_MARK = {buy: "사라", no: "사지 마라", maybe: "애매하다", hold: "지금은 못 산다"};
function callOf(d) {
  if (d.verdict === "REJECT") return "no";
  if (d.verdict === "BUY" && BUYABLE[d.availability]) return "buy";
  // 남이 쥐고 있는 도메인은 애매한 게 아니라 못 사는 것이다 — 말이 사실과 달랐던 자리
  if (d.availability === "taken") return "hold";
  return "maybe";
}
/* 이유 자리에는 그 도메인 얘기가 먼저 온다. "검사를 못 했다"류(키 없음·조회 막힘)는
   도메인 얘기가 아니라 이 도구의 사정이라 맨 뒤로 미룬다 — 예전에는 그 사정 세 줄이
   이유 1·2·3 을 다 차지해서, 답을 산 사람이 변명만 받아 갔다. */
const EXCUSE = /키가 없어|미확인|막혔|막혀|차단|조회.*못 했|검사.*못 했|못 봤|판정 불가|DNS/;
function whyLines(d) {
  const all = [...(d.fatal_reasons || []), ...(d.warn_reasons || [])];
  const real = all.filter((t) => !EXCUSE.test(t));
  const excuses = all.filter((t) => EXCUSE.test(t));
  const out = [...real];
  if (!out.length) {
    // 진짜 이유가 한 줄도 없으면 점수를 많이 준 항목이 그 도메인 얘기를 대신한다
    const items = [...((d.scoring && d.scoring.items) || [])]
      .filter((i) => i.earned !== null && i.earned !== undefined)
      .sort((a, b) => (b.earned || 0) - (a.earned || 0));
    items.slice(0, 3).forEach((i) => {
      out.push(i.label + " " + Math.round(i.earned || 0) + "/" + i.max_points + "점" +
        (i.note ? " — " + i.note : ""));
    });
  }
  excuses.forEach((t) => { if (out.length < 3) out.push(t); });
  return out.slice(0, 3).map(freshen);
}
/* 지금 상세로 보고 있는 도메인 — 다음/이전 넘기기의 기준점 */
let detailDomain = null;
function stepDetail(dir) {
  const vis = visibleRows();
  const idx = vis.findIndex((d) => d.domain === detailDomain);
  const target = vis[idx + dir];
  if (target) openDetail(target.domain);
}
$("detailPrev").onclick = () => stepDetail(-1);
$("detailNext").onclick = () => stepDetail(1);

async function openDetail(domain) {
  const entry = rows.get(domain);
  if (!entry) return;
  const d = entry.data;
  entry.el.dataset.seen = "true";  // 훑던 자리 표시 — 열어 본 줄은 목록에서 한 단 눕는다
  detailDomain = domain;
  // 끝에 닿으면 그쪽 단추를 꺼 둔다
  const vis = visibleRows();
  const idx = vis.findIndex((one) => one.domain === domain);
  $("detailPrev").disabled = idx <= 0;
  $("detailNext").disabled = idx < 0 || idx >= vis.length - 1;
  $("detailTitle").textContent = domain;
  const call = callOf(d);
  $("detailCall").dataset.call = call;
  $("detailMark").textContent = CALL_MARK[call];
  $("detailSub").textContent =
    [d.availability_label, expiresText(d), scoreText(d), when(d.finished_at) + " 검사"]
      .filter(Boolean).join(" · ");
  $("detailWhy").innerHTML = whyLines(d).map((t, i) =>
    '<li><span class="app-why-no">' + (i + 1) + "</span><span>" + escapeHtml(t) + "</span></li>").join("");
  setOpen($("detailMoreBox"), false);
  $("detailBody").innerHTML = '<p class="muted">불러오는 중…</p>';
  openSheet("sheetDetail", "closeDetail");
  const res = await fetch("/api/detail/" + encodeURIComponent(domain));
  const data = await res.json();
  $("detailBody").innerHTML = res.ok
    ? freshen(data.html)
    : '<p class="muted">' + escapeHtml(data.detail || "불러오지 못했습니다.") + "</p>";
}

/* ---------- 설정 ---------- */
const KEY_FIELDS = ["openrouter", "serper", "openpagerank", "safebrowsing", "virustotal"];
// 좁은 화면에서 잘리지 않도록 가림표는 4칸만 보여 준다(뒤 4글자는 그대로 확인용).
function keyHint(el, data, name) {
  el.placeholder = data.has_key[name]
    ? "저장돼 있음 (●●●● " + data.keys_masked[name].slice(-4) + ")"
    : "아직 없음";
}
async function loadConfig() {
  const data = await (await fetch("/api/config")).json();
  KEY_FIELDS.forEach((name) => {
    const el = $("k_" + name);
    keyHint(el, data, name);
    el.value = "";
  });
}

/* 저장 단추 없음 — 키를 붙여넣으면 잠깐 뒤 저절로 저장된다.
   화면에서 뺀 설정(검사 속도·세이프 브라우징·화면 사진)은 저장할 때마다 기본값으로
   되돌린다 — 예전 판에서 바꿔 둔 값이 몰래 남지 않게. 바이러스토탈을 켤지는
   서버가 키가 있는지로 스스로 정한다(server.py set_config). */
let cfgTimer = null;
KEY_FIELDS.forEach((name) => {
  const el = $("k_" + name);
  el.addEventListener("input", () => { clearTimeout(cfgTimer); cfgTimer = setTimeout(saveConfig, 900); });
  el.addEventListener("change", saveConfig);
});
async function saveConfig() {
  clearTimeout(cfgTimer);
  const body = {speed_mode: "adaptive", enable_safebrowsing: true, enable_capture: true};
  const filled = KEY_FIELDS.filter((name) => $("k_" + name).value.trim());
  filled.forEach((name) => { body[name] = $("k_" + name).value.trim(); });
  const res = await fetch("/api/config", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
  });
  if (!res.ok) { $("cfgMsg").textContent = "저장하지 못했습니다 — 잠시 뒤 다시 붙여넣어 주세요."; return; }
  const data = await (await fetch("/api/config")).json();
  filled.forEach((name) => {
    const el = $("k_" + name);
    if (el === document.activeElement) return;  // 아직 쓰는 중인 칸은 건드리지 않는다
    el.value = "";
    keyHint(el, data, name);
  });
  $("cfgMsg").textContent = "저장했습니다.";
}

/* ---------- 지우기 — 키와 결과는 내가 뺄 수 있어야 한다 ---------- */
$("clearKeys").onclick = async () => {
  if (!confirm("저장된 키를 전부 뺄까요? 검사는 키 없이도 돕니다.")) return;
  const res = await fetch("/api/config", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({clear_keys: KEY_FIELDS})
  });
  $("cfgMsg").textContent = res.ok ? "키를 전부 뺐습니다." : "빼지 못했습니다.";
  if (res.ok) await loadConfig();
};
$("clearResults").onclick = async () => {
  if (!confirm("저장된 검사 결과를 전부 지울까요? 되돌릴 수 없습니다.")) return;
  const res = await fetch("/api/results", {method: "DELETE"});
  if (!res.ok) {
    $("cfgMsg").textContent = (await res.json()).detail || "지우지 못했습니다.";
    return;
  }
  rows.clear();
  $("rows").innerHTML = "";
  $("takenRows").innerHTML = "";
  resumable = false;
  showResume([]);
  countVisible();
  $("cfgMsg").textContent = "검사 결과를 전부 지웠습니다.";
};

/* ---------- 시작 ---------- */
loadConfig();
fetch("/api/status").then((r) => r.json()).then((s) => {
  // 앱을 껐다 켜도 중단된 목록이 남아 있으면 "이어서 검사"가 살아 있어야 한다.
  resumable = Boolean(s.resumable);
  setRunning(Boolean(s.running));
  if (s.running) listen();
});
fetch("/api/results").then((r) => r.json()).then((d) => {
  (d.results || []).forEach((r) => addRow(r, true));
  applyView();
});
</script>
